name: Release

# Builds everything Comet ships as, and puts it on a draft release for review.
#
# How to start it:
#   * Actions -> Release -> Run workflow (needs this file on the default branch)
#   * or push a change to the VERSION file, or to this file, on any branch.
#     GitHub reads the workflow out of the commit that was pushed, so that works
#     even before this file has reached master, which is what makes the first
#     run possible.
#
# What it does: builds every platform, gathers the files, and creates a *draft*
# release tagged v<version>. Nothing is visible to anybody until it is published
# from the Releases page, which is also the moment the tag appears and the
# moment the app's own update check starts seeing it.
#
# What comes out:
#   Windows  Comet-<version>-windows-setup.exe      the installer
#            Comet.exe                            the standalone program
#            Comet-<version>-windows.msi            the same installer, msi
#            Comet-<version>-windows-portable.zip   the program in a folder
#   Linux    Comet-<version>-x86_64.AppImage        any distribution, WebKitGTK 4.1
#            comet_<version>_amd64.deb              Debian, Ubuntu, Mint
#            comet-<version>-1.x86_64.rpm           Fedora, RHEL, openSUSE
#            Comet-<version>-linux-portable.tar.gz  the binary and desktop files
#   Debian   comet_<version>_debian_amd64.deb       built against Debian's libs
#   Fedora   comet-<version>-1.fc.x86_64.rpm        built against Fedora's libs
#   Arch     comet-<version>-1-x86_64.pkg.tar.zst   pacman -U

on:
  push:
    # A push that changes the version is a release. Restricting it to that one
    # file keeps a build of the packaging targets off every ordinary commit.
    paths:
      - 'VERSION'
      # Changing what builds the releases is a good moment to build them, and
      # it is also how this file is worked on before it has reached master,
      # where the Run workflow button lives.
      - '.github/workflows/release.yml'
      # What the program is built out of is as much a part of a release as the
      # number on it: these change what ends up inside the installers.
      - 'web/src-tauri/Cargo.toml'
      - 'web/src-tauri/Cargo.lock'
      # The window configuration and the permissions the front end is granted:
      # both change what ends up inside the installers.
      - 'web/src-tauri/tauri.conf.json'
      - 'web/src-tauri/capabilities/**'
      - 'web/src-tauri/icons/**'
      - 'assets/icon/**'
      - 'packaging/windows/**'
      - 'packaging/linux/**'
      - 'packaging/arch/**'
      - 'web/public/**'
      # The app itself. A change to what it does is a change to what is inside
      # the installers, and this is the only way to get those built: the manual
      # button needs this file on the default branch. It costs a few minutes of
      # runners per push, which is the price of an installer that is never
      # older than the code it came from.
      - 'web/src/**'
      - 'web/src-tauri/src/**'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'packaging/tauri-build.sh'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty to use the VERSION file)'
        required: false
        default: ''

permissions:
  contents: write

# Optional public Logo API client ID, registered by the project owner.
env:
  VITE_BRANDFETCH_CLIENT_ID: ${{ vars.COMET_BRANDFETCH_CLIENT_ID }}

jobs:
  # ----------------------------------------------------------------- the number
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A tag push, then whatever was typed by hand, then the VERSION file: the
      # file is the normal way in, the other two are for one-off runs.
      - id: read
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TYPED: ${{ inputs.version }}
        run: |
          raw="${TAG:-${TYPED:-$(cat VERSION)}}"
          raw="${raw#v}"
          if [ -z "$raw" ]; then
            echo "No version: put one in VERSION, or type one when running this." >&2
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "Building Comet $raw"

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (setup, standalone, portable)
    runs-on: windows-latest
    needs: version
    env:
      COMET_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the version
        run: node packaging/version.mjs "$env:COMET_VERSION"
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install the front end's dependencies
        working-directory: web
        run: npm ci

      # nsis makes the setup exe, msi makes an installer for anyone who prefers
      # that. Both are built from the same binary, which is also left behind:
      # that is the standalone exe.
      - name: Build
        working-directory: web
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          $ErrorActionPreference = "Continue"
          npx tauri build --bundles nsis,msi *>&1 | Tee-Object -FilePath "../windows-build.log"
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            # Publish useful diagnostics as annotations: hosted runner log URLs
            # are not always reachable from a restricted development sandbox.
            $lines = Get-Content "../windows-build.log"
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'error(\[E[0-9]+\])?:|error:|failed to') {
                $detail = ($lines[$i..([Math]::Min($i + 4, $lines.Count - 1))] -join ' ')
                Write-Output "::error::$detail"
              }
            }
            exit $buildExit
          }

      - name: Collect the installers
        shell: pwsh
        run: |
          $version = "$env:COMET_VERSION" -replace '^v', ''
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $release = "web/src-tauri/target/release"
          Get-ChildItem "$release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "$out/Comet-$version-windows-setup.exe"
          }
          Get-ChildItem "$release/bundle/msi/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "$out/Comet-$version-windows.msi"
          }

          # The standalone program: one exe, the interface already inside it.
          $exe = Join-Path $release "comet.exe"
          if (-not (Test-Path -PathType Leaf $exe)) { throw "Expected standalone executable not found: $exe" }
          Add-Type -AssemblyName System.Drawing
          $appIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if ($null -eq $appIcon) { throw "The standalone executable has no embedded application icon." }
          $appIcon.Dispose()
          Copy-Item $exe "$out/Comet.exe"

          # The portable folder: the same program, with a line saying so.
          $portable = "artifacts/portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe "$portable/Comet.exe"
          if ((Get-FileHash "$portable/Comet.exe").Hash -ne (Get-FileHash $exe).Hash) { throw "Portable executable differs from standalone." }
          $readme = @(
            "Comet $version, portable",
            "",
            "Run Comet.exe; no installer is required. Your files remain in the",
            "workspace folder you choose. Preferences and organization are kept",
            "in the application's local profile, not alongside this executable.",
            "Removing this folder removes the program, not your files or profile.",
            "",
            "Windows 10 and 11 already have the WebView2 runtime that Comet draws",
            "its interface with. On an older or stripped-down Windows, install it",
            "once from https://developer.microsoft.com/microsoft-edge/webview2/"
          ) -join "`r`n"
          Set-Content -Path "$portable/Read me.txt" -Value $readme -Encoding utf8
          Compress-Archive -Path "$portable/*" -DestinationPath "$out/Comet-$version-windows-portable.zip"
          # Never replace an existing draft with an incomplete set of installers.
          foreach ($file in @("Comet-$version-windows-setup.exe", "Comet-$version-windows.msi", "Comet.exe", "Comet-$version-windows-portable.zip")) {
            if (-not (Test-Path -Path (Join-Path $out $file) -PathType Leaf)) { throw "Expected release artifact missing: $file" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error


  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux (deb, rpm, AppImage)
    # 22.04 on purpose: what is built on it runs on anything newer, and glibc
    # only moves forward. A newer runner would produce a binary that refuses to
    # start on Debian 12 or Ubuntu 22.04.
    runs-on: ubuntu-22.04
    needs: version
    env:
      COMET_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the version
        run: node packaging/version.mjs "$COMET_VERSION"

      - name: Install the system libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Install the front end's dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: bash ../packaging/tauri-build.sh --bundles deb,rpm

      - name: Upload the Tauri build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-linux
          path: tauri-build.log
          if-no-files-found: error

      - name: Collect the deb, the rpm and the tarball
        run: |
          set -euo pipefail
          trap 'echo "::error title=Collecting packages::command failed on line $LINENO"' ERR
          version="${COMET_VERSION#v}"
          mkdir -p artifacts
          cp web/src-tauri/target/release/bundle/deb/*.deb "artifacts/comet_${version}_amd64.deb"
          cp web/src-tauri/target/release/bundle/rpm/*.rpm "artifacts/comet-${version}-1.x86_64.rpm"

          # A plain tarball as well, for anyone who would rather not have a
          # package manager involved, and for Arch to unpack by hand.
          portable="Comet-${version}-linux-portable"
          mkdir -p "$portable"
          cp web/src-tauri/target/release/comet "$portable/comet"
          cp packaging/linux/comet.desktop "$portable/comet.desktop"
          cp packaging/linux/comet-x11 "$portable/comet-x11"
          cp packaging/linux/comet-x11.desktop "$portable/comet-x11.desktop"
          cp packaging/linux/com.comet.desktop "$portable/com.comet.desktop"
          cp web/src-tauri/icons/128x128.png "$portable/comet.png"
          cp LICENSE "$portable/LICENSE"
          # A tarball cannot declare dependencies, so it says what it needs
          # instead. The packaged builds ask for the same things themselves.
          cp packaging/linux/portable-readme.txt "$portable/README.txt"
          tar -czf "artifacts/$portable.tar.gz" "$portable"
          echo "::notice title=Collected::$(ls artifacts | tr '\n' ' ')"

      - name: Assemble the AppImage
        run: |
          set -euo pipefail
          trap 'echo "::error title=Assembling the AppImage::command failed on line $LINENO"' ERR
          version="${COMET_VERSION#v}"
          # The AppImage is assembled here rather than left to linuxdeploy.
          # linuxdeploy copies every library it can resolve into the image,
          # which for WebKitGTK and GStreamer means hundreds of megabytes that
          # then break on the distributions those versions were not taken
          # from. A thin image that asks the host for them, the way every other
          # Linux package here does, is smaller and far more likely to run.
          appdir="Comet.AppDir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/128x128/apps" \
                   "$appdir/usr/share/licenses/comet"
          cp web/src-tauri/target/release/comet "$appdir/usr/bin/comet"
          cp packaging/linux/comet-x11 "$appdir/usr/bin/comet-x11"
          cp web/src-tauri/icons/128x128.png "$appdir/comet.png"
          cp web/src-tauri/icons/128x128.png "$appdir/usr/share/icons/hicolor/128x128/apps/comet.png"
          cp web/src-tauri/icons/128x128.png "$appdir/usr/share/icons/hicolor/128x128/apps/com.comet.png"
          cp packaging/linux/com.comet.desktop "$appdir/usr/share/applications/com.comet.desktop"
          cp packaging/linux/appimage/AppRun "$appdir/AppRun"
          cp packaging/linux/appimage/README.txt "$appdir/README-appimage.txt"
          cp LICENSE "$appdir/usr/share/licenses/comet/LICENSE"
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/comet" "$appdir/usr/bin/comet-x11"

          # Both menu entries go inside, with Exec pointed at AppRun: the
          # launcher a desktop integration writes is the image itself, so the
          # `comet` on the PATH is not what has to start.
          sed 's|^Exec=.*$|Exec=AppRun|' packaging/linux/comet.desktop > "$appdir/comet.desktop"
          sed 's|^Exec=.*$|Exec=AppRun --x11|' packaging/linux/comet-x11.desktop > "$appdir/comet-x11.desktop"
          cp "$appdir"/comet*.desktop "$appdir/usr/share/applications/"
          echo "::notice title=AppDir::$appdir is ready"

          # Pinned to a release and checked against its published digest, so
          # rebuilding this tag makes the same image. --appimage-extract-and-run
          # is what lets the tool work on a runner with no FUSE device.
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum --check
          chmod +x /tmp/appimagetool
          echo "::notice title=appimagetool::downloaded and digest checked"

          # APP has to be named: with two desktop files at the root the tool
          # would otherwise pick one of them, and alphabetically that is the
          # X11 one. VERSION and ARCH fill in the rest of the file name.
          if ! APP=comet VERSION="$version" ARCH=x86_64 \
            /tmp/appimagetool --appimage-extract-and-run "$appdir" \
            "artifacts/Comet-${version}-x86_64.AppImage" > /tmp/appimagetool.log 2>&1; then
            detail=$(tail -n 12 /tmp/appimagetool.log | tr '\r\n' '  ' | cut -c1-3000 | sed 's/%/%25/g')
            echo "::error title=appimagetool::$detail"
            exit 1
          fi
          echo "::notice title=AppImage::$(ls -l "artifacts/Comet-${version}-x86_64.AppImage")"

      # Bundling quietly leaving it out is the failure mode worth guarding, so
      # look inside the finished packages instead of trusting the build log.
      - name: Check the AppImage
        run: |
          version="${COMET_VERSION#v}"
          bash packaging/linux/check-appimage.sh "The AppImage" "artifacts/Comet-${version}-x86_64.AppImage"

      - name: Check the entry points and dependencies reached the packages
        shell: bash
        run: |
          version="${COMET_VERSION#v}"
          bash packaging/linux/check-x11.sh "The deb" "artifacts/comet_${version}_amd64.deb" dpkg-deb --contents
          # This deb is built on 22.04 so that it installs anywhere newer, so
          # that is the release its dependencies are checked against. The rpm
          # beside it is checked in the Fedora job, which has the repositories
          # to check it against.
          bash packaging/linux/check-deps.sh "The deb" apt "artifacts/comet_${version}_amd64.deb" \
            libayatana-appindicator3-1 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire
          bash packaging/linux/check-x11.sh "The rpm" "artifacts/comet-${version}-1.x86_64.rpm" rpm -qlvp

          # The tarball keeps its files at the top level, so the check written
          # for an installed layout does not fit it.
          portable="Comet-${version}-linux-portable.tar.gz"
          listing=$(tar -tzvf "artifacts/$portable")
          # Say what is actually in there. A check that only reports its own
          # verdict leaves nothing to reason from when it is wrong.
          echo "::notice title=The portable tarball contains::$(printf '%s' "$listing" | tr '\n' ' ')"
          printf '%s\n' "$listing" | grep -E '/comet-x11$' | grep -q rwx \
            || { echo "::error title=The portable tarball::the X11 wrapper is missing or cannot be run"; exit 1; }
          printf '%s\n' "$listing" | grep -qE '/comet-x11\.desktop$' \
            || { echo "::error title=The portable tarball::the X11 menu entry is missing"; exit 1; }
          printf '%s\n' "$listing" | grep -qE '/com\.comet\.desktop$' \
            || { echo "::error title=The portable tarball::the application-id menu entry is missing"; exit 1; }
          # The only channel that cannot declare its dependencies has to carry
          # the note about them instead.
          printf '%s\n' "$listing" | grep -qE '/README\.txt$' \
            || { echo "::error title=The portable tarball::the note about the sound plugins is missing, saw: $(printf '%s' "$listing" | tr '\n' ' ')"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Debian
  debian:
    name: Debian (native deb)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: version
    env:
      COMET_VERSION: ${{ needs.version.outputs.version }}
    # Debian's own libraries and Debian's own dpkg, so the package is built
    # against the system it is meant for rather than against Ubuntu's. Best
    # effort: if a package name has moved, the Linux job's deb still works.
    container: debian:13
    steps:
      - name: Install what the build needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl wget file git ca-certificates \
            libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev \
            nodejs npm

      # Debian 13's own rustc lags what Tauri's crates ask for, so the
      # toolchain comes from rustup instead of from the distribution. The
      # package itself is still built with Debian's libraries and Debian's
      # dpkg, which is the part a Debian package has to get right.
      - name: Install Rust with rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain
        run: |
          cargo --version
          rustc --version

      - uses: actions/checkout@v4

      # A container's files are not owned by the user git runs as.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set the version
        run: node packaging/version.mjs "$COMET_VERSION"

      - name: Install the front end's dependencies
        working-directory: web
        run: npm ci

      - name: Build the deb
        working-directory: web
        run: bash ../packaging/tauri-build.sh --bundles deb

      - name: Upload the Tauri build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-debian
          path: tauri-build.log
          if-no-files-found: error

      - name: Collect it
        run: |
          version="${COMET_VERSION#v}"
          mkdir -p artifacts
          cp web/src-tauri/target/release/bundle/deb/*.deb "artifacts/comet_${version}_debian_amd64.deb"

      - name: Check the entry points and dependencies reached the package
        shell: bash
        run: |
          version="${COMET_VERSION#v}"
          bash packaging/linux/check-x11.sh "The Debian deb" "artifacts/comet_${version}_debian_amd64.deb" dpkg-deb --contents
          bash packaging/linux/check-deps.sh "The Debian deb" apt "artifacts/comet_${version}_debian_amd64.deb" \
            libayatana-appindicator3-1 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire

      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: artifacts/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Fedora
  fedora:
    name: Fedora (native rpm)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: version
    env:
      COMET_VERSION: ${{ needs.version.outputs.version }}
    container: fedora:latest
    steps:
      - name: Install what the build needs
        run: |
          dnf install -y \
            @development-tools nodejs npm \
            webkit2gtk4.1-devel openssl-devel curl wget file \
            libappindicator-gtk3-devel librsvg2-devel rpm-build \
            gtk3-devel libsoup3-devel dbus-devel patchelf
          # Named differently across Fedora releases, and not needed for the
          # package itself.
          dnf install -y libxdo-devel || dnf install -y xdotool-devel || true

      # Use the same current Rust as the main build. Fedora's package version
      # can lag behind the minimum required by the Tauri crates in Cargo.lock.
      - name: Install Rust with rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain
        run: |
          cargo --version
          rustc --version

      - uses: actions/checkout@v4

      # A container's files are not owned by the user git runs as.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set the version
        run: node packaging/version.mjs "$COMET_VERSION"

      - name: Install the front end's dependencies
        working-directory: web
        run: npm ci

      - name: Build the rpm
        working-directory: web
        run: bash ../packaging/tauri-build.sh --bundles rpm

      - name: Upload the Tauri build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-fedora
          path: tauri-build.log
          if-no-files-found: error

      - name: Collect it
        run: |
          version="${COMET_VERSION#v}"
          mkdir -p artifacts
          cp web/src-tauri/target/release/bundle/rpm/*.rpm "artifacts/comet-${version}-1.fc.x86_64.rpm"

      - name: Check the entry points and dependencies reached the package
        shell: bash
        run: |
          version="${COMET_VERSION#v}"
          bash packaging/linux/check-x11.sh "The Fedora rpm" "artifacts/comet-${version}-1.fc.x86_64.rpm" rpm -qlvp
          bash packaging/linux/check-deps.sh "The Fedora rpm" dnf "artifacts/comet-${version}-1.fc.x86_64.rpm" \
            libappindicator-gtk3 gstreamer1-plugins-base gstreamer1-plugins-good pipewire-gstreamer

      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: artifacts/*
          if-no-files-found: error

  # ------------------------------------------------------------------- Arch
  arch:
    name: Arch (pacman package)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: version
    env:
      COMET_VERSION: ${{ needs.version.outputs.version }}
    container: archlinux:latest
    steps:
      - name: Install what the build needs
        run: |
          # Everything the PKGBUILD names in depends has to be here too:
          # makepkg checks them before it will build, and exits 8 if one is
          # missing. Keeping this list and the PKGBUILD's in step is what makes
          # that check worth anything.
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm sudo curl ca-certificates \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg openssl \
            gst-plugins-base gst-plugins-good gst-plugin-pipewire \
            libsoup3 xdotool dbus

      # Keep the Rust compiler in step with the toolchain used by the other
      # release jobs rather than relying on when Arch refreshed its package.
      - name: Install Rust with rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain
        run: |
          cargo --version
          rustc --version

      - uses: actions/checkout@v4

      # A container's files are not owned by the user git runs as.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set the version
        run: node packaging/version.mjs "$COMET_VERSION"

      - name: Install the front end's dependencies
        working-directory: web
        run: npm ci

      # --no-bundle: Arch has no use for a .deb, and makepkg below makes the
      # package that pacman does understand.
      - name: Build
        working-directory: web
        run: bash ../packaging/tauri-build.sh --no-bundle

      - name: Upload the Tauri build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-arch
          path: tauri-build.log
          if-no-files-found: error

      - name: Package it for pacman
        run: |
          version="${COMET_VERSION#v}"
          mkdir -p artifacts
          work="$(mktemp -d)"
          cp packaging/arch/PKGBUILD "$work/"
          cp web/src-tauri/target/release/comet "$work/comet"
          cp packaging/linux/comet.desktop "$work/comet.desktop"
          cp packaging/linux/comet-x11 "$work/comet-x11"
          cp packaging/linux/comet-x11.desktop "$work/comet-x11.desktop"
          cp packaging/linux/com.comet.desktop "$work/com.comet.desktop"
          cp web/src-tauri/icons/128x128.png "$work/comet.png"
          # The package installs the licence text, so it has to be beside the
          # PKGBUILD for makepkg to find it in the sources.
          cp LICENSE "$work/LICENSE"
          sed -i "s/^pkgver=.*/pkgver=$version/" "$work/PKGBUILD"

          # makepkg refuses to run as root, which is what a container gives you,
          # so it runs as a user that owns the work folder.
          chown -R builder "$work" 2>/dev/null || { useradd -m builder; chown -R builder "$work"; }
          cd "$work"
          sudo -u builder makepkg -f
          cp "$work"/*.pkg.tar.zst "$GITHUB_WORKSPACE/artifacts/comet-${version}-1-x86_64.pkg.tar.zst"

      - name: Check the entry points reached the package
        shell: bash
        run: |
          version="${COMET_VERSION#v}"
          package="artifacts/comet-${version}-1-x86_64.pkg.tar.zst"
          listing="$(tar -tvf "$package")"
          printf '%s\n' "$listing" | grep -E 'usr/bin/comet$' | grep -q rwx
          printf '%s\n' "$listing" | grep -E 'usr/bin/comet-x11$' | grep -q rwx
          printf '%s\n' "$listing" | grep -qE 'applications/comet\.desktop$'
          printf '%s\n' "$listing" | grep -qE 'applications/com\.comet\.desktop$'
          bash packaging/linux/check-deps.sh "The Arch package" pacman "$package" \
            gst-plugins-base gst-plugins-good gst-plugin-pipewire

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: artifacts/*
          if-no-files-found: error

  # --------------------------------------------------------------- the release
  release:
    name: Draft a release
    # Everything that produces a file, including the best-effort jobs: a platform
    # that failed to build must not stop the others from being offered.
    needs: [version, windows, linux, debian, fedora, arch]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      COMET_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Download only installable release bundles. Debug logs are separate
      # artifacts and must never become public release files.
      # Download only installable release bundles. Debug logs are separate
      # artifacts and must never become public release files. The two core
      # builds are not best-effort: a draft that silently misses them looks
      # complete and is not, so their files missing fails here, loudly.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: files/windows
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: files/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: debian
          path: files/debian
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fedora
          path: files/fedora
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: arch
          path: files/arch

      - name: List what was built
        run: ls -R files || true

      - name: Write the release notes
        run: |
          version="${COMET_VERSION#v}"
          cat > notes.md <<EOF
          Comet ${version}.

          **Windows** - \`Comet-${version}-windows-setup.exe\` installs it;
          \`Comet-${version}-windows.msi\` is the MSI installer; \`Comet.exe\`
          is the standalone program; and \`Comet-${version}-windows-portable.zip\`
          contains Comet.exe and a short readme.

          **Linux** - \`Comet-${version}-x86_64.AppImage\` runs anywhere with
          WebKitGTK 4.1; \`comet_${version}_amd64.deb\` is for Debian, Ubuntu
          and Mint, \`comet-${version}-1.x86_64.rpm\` is the RPM build, and
          \`Comet-${version}-linux-portable.tar.gz\` is the binary and desktop
          files. Debian, Fedora and Arch also have native packages when their
          best-effort jobs succeed.

          Comet looks for notes in your vault and adds them when you ask it to; nothing
          is read or launched until you do.
          EOF
          if [ "$version" = "1.0" ]; then
            cat >> notes.md <<'EOF'

          Cloud sync is paused in this version; it is not available in the app.
          Local files, local calendar events, and existing remote histories are
          preserved. Google events remain in Google Calendar, and previously saved
          cloud authorizations are not revoked. The older 0.1.0 updater cannot
          detect the two-part v1.0 label, so upgrade from 0.1.0 by installing
          manually.
          EOF
          fi

      # Whether this version is already out there.
      #
      # Publishing is the player's decision, made by hand, and a build that ran
      # afterwards must not quietly take that decision back: drafting a release
      # that has been published would remove it from the releases page and from
      # every installed copy's update check.
      - name: Is this version already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${COMET_VERSION#v}"
          record=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv")
          record="${record%%$'\n'*}"
          if [ -n "$record" ]; then
            IFS=$'\t' read -r release_id state <<< "$record"
          else
            release_id=
            state=missing
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          if [ "$state" = "false" ]; then
            echo "$tag is published already, so its files are left as they are." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A draft on purpose: the files are there to be looked at, and publishing
      # is what creates the tag, puts the release on the releases page, and lets
      # the app's own update check see it. Old files are cleared first so a
      # failed job cannot leave yesterday's package attached to today's draft.
      - name: Clear assets from an older draft build
        if: steps.published.outputs.state == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.published.outputs.release_id }}
        run: |
          asset_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[].id')
          while read -r asset_id; do
            [ -z "$asset_id" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
          done <<< "$asset_ids"

      # Overwriting means running this twice replaces files instead of failing.
      - uses: softprops/action-gh-release@v2
        if: steps.published.outputs.state != 'false'
        with:
          tag_name: v${{ env.COMET_VERSION }}
          name: Comet v${{ env.COMET_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          overwrite_files: true
          files: files/*/*
          body_path: notes.md
          fail_on_unmatched_files: true

      # The upload action attaches the files, but a draft that already exists
      # can keep yesterday's text. Set the body we just wrote as its own step so
      # the notes and the artifacts always describe the same run.
      - name: Put the notes on the draft
        if: steps.published.outputs.state != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${COMET_VERSION#v}"
          if ! output=$(gh release edit "$tag" --notes-file notes.md 2>&1); then
            echo "::error title=Could not put the release notes on the draft::$output"
            exit 1
          fi
          if ! gh release view "$tag" --json body --jq .body | grep -qF "**Linux**"; then
            echo "::error title=The draft notes::the Linux section is missing from the published draft body"
            exit 1
          fi

      # GitHub can keep the old target when an existing draft is reused. Ensure
      # that publishing this draft will tag the same commit that built its files.
      - name: Match draft target to the build
        if: steps.published.outputs.state != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${COMET_VERSION#v}"
          if ! output=$(gh release edit "$tag" --target "$GITHUB_SHA" 2>&1); then
            echo "::error title=Could not update draft target::$output"
            exit 1
          fi
          actual=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "Draft target $actual does not match build $GITHUB_SHA" >&2
            exit 1
          fi
